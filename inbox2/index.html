<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT桔子 · 早期 Leads</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
  background:#f5f7fa;margin:0;padding:18px;color:#1e293b}
.wrap{max-width:1080px;margin:0 auto}
header{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;padding:22px 28px;
  border-radius:14px;box-shadow:0 4px 16px rgba(234,88,12,.18)}
header h1{margin:0 0 6px;font-size:21px}
header .sub{opacity:.92;font-size:12px;line-height:1.5}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.16);border-radius:8px;padding:6px 12px;font-size:12px}
.filters{background:#fff;border-radius:10px;padding:10px 14px;margin:14px 0;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0}
.flabel{font-size:12px;font-weight:600;color:#64748b;margin-right:6px;min-width:34px}
.chip{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:3px 11px;
  font-size:12px;cursor:pointer;color:#475569}
.chip b{color:#ea580c;font-weight:700}
.chip.active{background:#ea580c;color:#fff;border-color:#ea580c}
.chip.active b{color:#fff}
.daysep{font-size:14px;color:#475569;margin:22px 4px 8px;border-bottom:1px solid #e2e8f0;
  padding-bottom:6px}
.card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.07);border:1px solid #eef2f7}
.card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.round{color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.name{font-size:16px;font-weight:700;color:#0f172a;text-decoration:none}
.name:hover{color:#ea580c}
.new{background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.ind-tag{font-size:11px;color:#64748b;background:#f1f5f9;padding:1px 8px;border-radius:10px}
.desc{color:#475569;font-size:13px;margin:7px 0 9px;line-height:1.5}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#64748b;margin-bottom:10px}
.meta strong{color:#475569}
.meta .date{color:#94a3b8}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{font-size:12px;text-decoration:none;padding:4px 11px;border-radius:7px;
  background:#f8fafc;border:1px solid #e2e8f0;color:#334155}
.btn:hover{background:#f1f5f9}
.btn-li{color:#0a66c2}
.btn-web{color:#3b82f6}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:48px 24px;
  text-align:center;color:#64748b;font-size:15px;line-height:1.9;margin-top:16px}
footer{text-align:center;color:#94a3b8;font-size:12px;margin:26px 0 10px}
@media(prefers-color-scheme:dark){
  body{background:#0f172a;color:#e2e8f0}
  .filters,.card,.empty{background:#1e293b;border-color:#334155}
  .chip{background:#334155;border-color:#475569;color:#cbd5e1}
  .name{color:#f1f5f9}.daysep{color:#cbd5e1;border-color:#334155}
  .ind-tag,.meta,.desc{color:#94a3b8}
  .btn{background:#334155;border-color:#475569;color:#e2e8f0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍊 IT桔子 · 早期投资事件</h1>
    <div class="sub">仅早期轮次（种子 / 天使 / A / B 系，已过滤 C 轮及以后）· 每日 6:00 自动更新 · 2026-07-13 11:57</div>
    <div class="stats">
      <div class="stat">📥 近 30 天 0 条</div>
      <div class="stat">🆕 今日新增 0</div>
    </div>
  </header>

  <div class="filters">
    <div class="frow"><span class="flabel">轮次</span>
      <button class="chip active" data-f="round" data-v="all" onclick="flt(this,'round','all')">全部</button>
      
    </div>
    <div class="frow"><span class="flabel">行业</span>
      <button class="chip active" data-f="industry" data-v="all" onclick="flt(this,'industry','all')">全部</button>
      
    </div>
  </div>

  <div id="list"><div class="empty">⏳ 首次数据抓取进行中，稍后会自动更新。<br>每日 6:00 自动刷新当日早期投资事件。</div></div>

  <footer>数据来源 IT桔子事件库 · 本页仅供个人筛选，不对外导航</footer>
</div>
<script>
const state={round:'all',industry:'all'};
function flt(btn,f,v){
  state[f]=v;
  document.querySelectorAll('.chip[data-f="'+f+'"]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(c=>{
    const okR=state.round==='all'||c.dataset.round===state.round;
    const okI=state.industry==='all'||c.dataset.industry===state.industry;
    c.style.display=(okR&&okI)?'':'none';
  });
  // 隐藏空日期分隔
  document.querySelectorAll('.daysep').forEach(h=>{
    let n=h.nextElementSibling,vis=false;
    while(n&&!n.classList.contains('daysep')){
      if(n.classList.contains('card')&&n.style.display!=='none'){vis=true;break;}
      n=n.nextElementSibling;
    }
    h.style.display=vis?'':'none';
  });
}
</script>
</body>
</html>
