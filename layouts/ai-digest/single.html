{{- define "main" }}
<style>
  .post-single { padding: 0 !important; background: transparent !important; box-shadow: none !important; border-radius: 0 !important; }
  .post-header { padding: 0 var(--gap) !important; }
  .post-content { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
  .main { max-width: 100% !important; padding: 0 !important; }
</style>
<article class="post-single">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if not (.Param "hideMeta") }}
    <div class="post-meta">
      {{- partial "post_meta.html" . -}}
    </div>
    {{- end }}
  </header>

  {{- if .Content }}
  <div class="post-content">
    {{ .Content }}
  </div>
  {{- end }}

</article>
{{- end }}
